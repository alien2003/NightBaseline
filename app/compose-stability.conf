// Classes the Compose compiler cannot infer as stable but that are immutable values (docs/development.md,
// "Performance"). Their parameters are then compared with equals() instead of identity, so a calendar cell given an
// equal but newly created LocalDate is skipped.
java.time.LocalDate
java.time.YearMonth
java.time.LocalTime
java.time.Instant
java.time.ZoneId
java.time.DayOfWeek
