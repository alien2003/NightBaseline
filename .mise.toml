[tools]
java = "temurin-17"
python = "3.12"

[env]
ANDROID_HOME = "{{config_root}}/.tooling/android-sdk"
ANDROID_SDK_ROOT = "{{config_root}}/.tooling/android-sdk"
GRADLE_USER_HOME = "{{config_root}}/.tooling/gradle"
# Windows adb via WSL interop (found on PATH through scoop shims).
ADB_WIN = "adb.exe"
# Debug keystore and other Android user state stay inside the project.
ANDROID_USER_HOME = "{{config_root}}/.tooling/android-user"
# Emulator AVDs and emulator state also stay inside the project.
ANDROID_AVD_HOME = "{{config_root}}/.tooling/android-user/avd"
ANDROID_EMULATOR_HOME = "{{config_root}}/.tooling/android-user"
_.path = [
  "{{config_root}}/.tooling/android-sdk/cmdline-tools/latest/bin",
  "{{config_root}}/.tooling/android-sdk/platform-tools",
]
_.python.venv = { path = "{{config_root}}/.tooling/venv", create = true }
